<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FISH FISH FISH</title>

    <link rel="icon" type="image/png"
        href="https://raw.githubusercontent.com/FloTheWiz/miscc/refs/heads/main/anchorx2.png">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <!-- Modals -->
    <div id="popup" class="popup">
        <div id="tooltip"></div>
        <div id="offlinePopup">
        <p id="offlinePopupText"></p><button id="offlinePopupClose">Nice</button>
        </div>
    </div>


    <!-- Main Text-->
    <div id="text" class="t mainFont">
        <h1 id="fishDisplay" style="color:white">LOADING</h1>
        <h2 id="fishPerSec"></h2>
    </div>
    <canvas id="gameCanvas" width="0" height="0"></canvas>



    <!-- Left side: Buildings -->
    <div class="t panelToggle" id="buildingToggle" style="left:16px;top:16px;">
        <button onclick="Game.togglePanel('building');"><img class="toggleImg"
                src="https://raw.githubusercontent.com/FloTheWiz/miscc/refs/heads/main/anchorx2.png"></button>
    </div>
    <div class="t panelContainer panelLeft" id="buildingContainer"></div>

    <!-- Left Middle  Cultist -->
    <div class="t panelToggle" id="cultistToggle" style="left:16px; top:40vh; display:none;">
        <button onclick="Game.togglePanel('cultist');"><div class="toggleImg" id="cultistButton"></div></button>
    </div>
    <div class="t panelContainer panelLeft" id="cultistContainer">
        <div class="panelBorder cultistBorder"></div>
    </div>


    
    <!-- Right side: Upgrades -->
    <div class="t panelToggle right" id="upgradeToggle" style="top:16px;">
        <button onclick="Game.togglePanel('upgrade');"><img class="toggleImg"
                src="https://raw.githubusercontent.com/FloTheWiz/miscc/refs/heads/main/anchorx2.png"></button>
    </div>
    <div class="t panelContainer panelRight" id="upgradeContainer">
        <div class="panelBorder"></div>
    </div>

    <!-- Right Middle  Bag -->
    <div class="t panelToggle" id="bagToggle" style="right:16px; top:40vh;">
        <button onclick="Game.togglePanel('bag');">
            <img class="toggleImg"
                src="https://raw.githubusercontent.com/FloTheWiz/miscc/refs/heads/main/anchorx2.png">
        </button>
    </div>
    <div class="t panelContainer panelRight" id="bagContainer"></div>

    <!-- Bottom-right: Settings -->
    <div class="t panelToggle" id="settingsToggle" style="right:16px; bottom:16px; top:auto;">
        <button onclick="Game.togglePanel('settings');">
            <img class="toggleImg"
                src="https://raw.githubusercontent.com/FloTheWiz/miscc/refs/heads/main/anchorx2.png">
        </button>
    </div>
    <div class="t panelContainer panelRight" id="settingsContainer"></div>




    <canvas id="ascendCanvas" width="0" height="0"></canvas>
    <div id="ascendUI">
        
    </div>
    <script src="main.js"></script>
</body>

</html>
